name: Update publications from Google Scholar

on:
  schedule:
    - cron: "17 6 * * 1" # Weekly, Monday ~06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch publications from Google Scholar
        run: node scripts/update-publications.mjs
        env:
          SCHOLAR_USER_ID: c22yUfAAAAAJ

      - name: Commit changes if the publication list changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/publications.json
          git diff --cached --quiet || git commit -m "Update publications from Google Scholar [skip ci]"
          git push
